function verdict(s, sA, sB, dir) {
  // SETUP_FORMING: SL Hunt strong (7+) but Tech weak (0-2) = waiting for trigger
  const forming = sA >= 7 && sB <= 2 && dir === "NO_TRADE";
  
  if (s < 8)  return { tag:"❌ NO TRADE",  c:"#ff1133", bg:"#ff113310", sz:0,  wr:"—", state:"NO_TRADE" };
  if (forming) return { tag:"⏳ SETUP FORMING", c:"#ff8800", bg:"#ff880010", sz:0, wr:"Wait for trigger", state:"FORMING" };
  if (s < 11) return { tag:"⚠️ SMALL",     c:"#ff8800", bg:"#ff880010", sz:25, wr:"~65-70%", state:"TRADE" };
  if (s < 14) return { tag:"🔥 MEDIUM",    c:"#ffcc00", bg:"#ffcc0010", sz:50, wr:"~75-82%", state:"TRADE" };
  if (s < 16) return { tag:"💰 FULL",      c:"#ff3300", bg:"#ff330010", sz:100,wr:"~85-88%", state:"TRADE" };
  return           { tag:"💎 MAX",        c:"#00ff88", bg:"#00ff8810", sz:120,wr:"~90%+", state:"TRADE" };
}

// ═══ BINANCE REAL-TIME via WebSocket ═══
function getBinancePrice(coin) {
  return new Promise((resolve) => {
    const sym = (BN_SYM[coin] || coin+"USDT").toLowerCase();
    try {
      const ws = new WebSocket(`wss://stream.binance.com:9443/ws/${sym}@ticker`);
      const timeout = setTimeout(() => { try{ws.close();}catch(e){} resolve(null); }, 3000);
      ws.onmessage = (e) => {
        clearTimeout(timeout);
        try {
          const d = JSON.parse(e.data);
          ws.close();
          resolve({
            price: parseFloat(d.c),
            high24: parseFloat(d.h),
            low24: parseFloat(d.l),
            change24: parseFloat(d.P),
            vol24usd: parseFloat(d.q),
          });
        } catch { try{ws.close();}catch(e){} resolve(null); }
      };
      ws.onerror = () => { clearTimeout(timeout); resolve(null); };
      ws.onclose = () => {};
    } catch { resolve(null); }
  });
}

// ═══ AI CALL (with 60s timeout) ═══
async function callAI(promptText) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 90000);
  try {
    const r = await fetch(BACKEND_URL + "/api/analyze", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      signal: controller.signal,
      body: JSON.stringify({ prompt: promptText })
    });
    clearTimeout(timeout);
    const d = await r.json();
    if(!d.success) throw new Error(d.error || "AI call failed — check Vercel env vars");
    return d.text;
  } catch(e) {
    clearTimeout(timeout);
    if(e.name === "AbortError") throw new Error("AI timeout — try again");
    throw e;
  }
}

function parseJSON(t) {
  try { return JSON.parse(t.trim()); } catch{}
  const c = t.replace(/```json\s*/gi,"").replace(/```\s*/gi,"").trim();
  try { return JSON.parse(c); } catch{}
  const m = c.match(/\{[\s\S]*\}/);
  if(m) try { return JSON.parse(m[0]); } catch{}
  return null;
}

      if(mp > 0) {
        const ld = liveData || {};
        setLive({...ld, price: mp, source: "BINANCE (manual)", note: "", high24: ld.high24||mp*1.02, low24: ld.low24||mp*0.98, change24: ld.change24||0, change7d: ld.change7d||0, change30d: ld.change30d||0, vol24: ld.vol24||0, mcap: ld.mcap||0, ath: ld.ath||0, athDrop: ld.athDrop||0, rank: ld.rank||0, name: ld.name||sel});
        setMsg(`✅ ${sel} = $${mp.toLocaleString()} (BINANCE manual) · Fear: ${fear?.value||"?"}`);
        setProg(25);
      } else if(liveData?.price > 0) {
        setLive(liveData);
        setMsg(`✅ ${sel} = $${liveData.price.toLocaleString()} · Fear: ${fear?.value||"?"}`);
        setProg(25);
      } else {
        setMsg(`⚠️ Price API fail — AI will search`);
        setProg(15);
      }
      
      // Use manual price for AI prompt
      const priceForAI = mp > 0 ? {...(liveData||{}), price: mp} : liveData;
      
      // STEP 2: AI (2 searches + scoring)
      setMsg("🔍 Search 1/3: Current price..."); setProg(30);
      
      const progTimer = setInterval(() => {
        setProg(p => {
          if(p >= 88) return p;
          const msgs = [
            [40,"🔍 Search 2/3: Funding, L/S, OI..."],
            [52,"🔍 Search 3/3: RSI, whale, news..."],
            [62,"🧮 Scoring 18 checks..."],
            [72,"📊 Building trade plan..."],
            [80,"📝 Summary..."],
            [85,"✅ Almost done..."],
          ];
          const next = msgs.find(m => m[0] > p);
          if(next) { setMsg(next[1]); return next[0]; }
          return Math.min(p + 0.3, 88);
        });
      }, 2500);
      
      const raw = await callAI(prompt(sel, cap, priceForAI, fear));
      clearInterval(progTimer);
      setProg(90); setMsg("🧮 Parsing...");
      
      let data = parseJSON(raw);
      if(!data && retry.current < 1) {
        retry.current++;
        setMsg("🔄 Retry..."); setProg(50);
        const raw2 = await callAI(prompt(sel, cap, priceForAI, fear));
        data = parseJSON(raw2);
      }
      if(!data) throw new Error("Parse fail — try again");

      // STEP 3: Post-process — Manual price > AI price > CoinGecko
      const mp2 = parseFloat(manualPrice) || 0;
      if(mp2 > 0) {
        // Manual price is KING — override everything
        data.price = mp2;
        setLive(prev => prev ? {...prev, price: mp2, source: "BINANCE (manual)"} : {price: mp2, source: "BINANCE (manual)"});
      } else if(data.price && data.price > 0) {
        // AI found fresh price from search — use it
        setLive(prev => prev ? {...prev, price: data.price, source: (prev.source||"") + " → AI fresh"} : {price: data.price, source: "AI Search"});
      } else if(liveData?.price > 0) {
        // Fallback to CoinGecko
        data.price = liveData.price;
      }
      // 24h high/low from CoinGecko if AI didn't provide
      if(!data.price_24h_high && liveData?.high24) data.price_24h_high = liveData.high24;
      if(!data.price_24h_low && liveData?.low24) data.price_24h_low = liveData.low24;
      if(fear?.value || liveData?.fearGreed) {
        data.fear_greed = liveData?.fearGreed || fear?.value || data.fear_greed;
        const fv = fear.value;
        data.mood = fv<=10?"EXTREME_FEAR":fv<=25?"FEAR":fv<=45?"NEUTRAL":fv<=75?"GREED":"EXTREME_GREED";
      }
      
      const sA = (data.slHunt||[]).filter(x=>x.p).length;
      const sB = (data.emaSSL||[]).filter(x=>x.p).length;
      data._sA = sA; data._sB = sB; data._total = sA + sB;

      // Auto-fix huntType
      if(data.crowd==="SHORT_HEAVY" && sA>=7) data.huntType = "HUNTING_SHORTS";
      if(data.crowd==="LONG_HEAVY" && sA>=7) data.huntType = "HUNTING_LONGS";
      
      // Clean long text
      if(data.huntZone?.length > 25) {
        const m = data.huntZone.match(/\$[\d,.]+-?\$?[\d,.]+[Kk]?/);
        data.huntZone = m ? m[0] : data.huntZone.substring(0,25);
      }
      if(data.crowdPct?.length > 20) {
        const m = data.crowdPct.match(/\d+%?\s*(shorts?|longs?)/i);
        data.crowdPct = m ? m[0] : data.crowdPct.substring(0,20);
      }
      (data.slHunt||[]).forEach(s => { if(s.v?.length > 35) s.v = s.v.substring(0,35); });
      (data.emaSSL||[]).forEach(s => { if(s.v?.length > 35) s.v = s.v.substring(0,35); });
      
      // Setup forming detection
      if(data._total >= 8 && data.dir === "NO_TRADE") {
        if(data.huntType === "HUNTING_SHORTS") { data._sugDir = "LONG"; data._sugReason = "Shorts trapped, squeeze forming"; }
        if(data.huntType === "HUNTING_LONGS") { data._sugDir = "SHORT"; data._sugReason = "Longs trapped, dump forming"; }
      }
      
      setProg(100); setMsg("✅ Done!");
      setR(data); setTab(0);
    } catch(e) {
      setErr(e.message || "Error");
    } finally {
      setLoading(false); retry.current = 0;
    }
  }, [sel, cap, manualPrice]);

  const V = R ? verdict(R._total||0, R._sA||0, R._sB||0, R?.dir||"NO_TRADE") : null;
  const dir = R?.dir || "NO_TRADE";
  const isL = dir==="LONG";
  const dc = isL?"#00ff88":dir==="SHORT"?"#ff3300":"#605088";

  // ═══ STYLES ═══
  const bg = "#06040e";
  const card = "#0d0918";
  const bdr = "#1a1230";

  return (
    <div style={{minHeight:"100vh",background:bg,color:"#c0b0e0",fontFamily:"'SF Pro Text','Segoe UI',system-ui,sans-serif"}}>
      {/* Ambient */}
      <div style={{position:"fixed",top:0,left:0,right:0,height:400,background:"radial-gradient(ellipse at 50% 0%,rgba(120,60,255,0.04),transparent 65%)",pointerEvents:"none"}}/>
      
      <div style={{maxWidth:540,margin:"0 auto",padding:"10px 12px 50px",position:"relative",zIndex:1}}>
        
        {/* Header */}
        <div style={{textAlign:"center",padding:"10px 0 14px"}}>
          <div style={{display:"inline-block",padding:"3px 12px",borderRadius:16,border:"1px solid rgba(255,51,0,0.35)",background:"rgba(255,51,0,0.06)",fontSize:8,letterSpacing:2,color:"#ff3300",fontWeight:700,textTransform:"uppercase",marginBottom:6}}>
            COMBINED · SL HUNT + EMA SSL RSI
          </div>
          <h1 style={{fontSize:18,fontWeight:800,color:"#f0eaff",letterSpacing:-0.5,margin:"4px 0 2px"}}>
            Crypto <span style={{color:"#ff3300"}}>Trade</span> Analyzer
          </h1>
          <p style={{fontSize:9.5,color:"#605088"}}>18-Point Dual Strategy · AI Real-Time · Exact Entry/Exit/SL</p>
        </div>

        {/* Input */}
        <div style={{background:card,border:`1px solid ${bdr}`,borderRadius:12,padding:12,marginBottom:8}}>
          <div style={{display:"flex",gap:8}}>
            <div style={{flex:2}}>
              <Lbl>COIN</Lbl>
              <div style={{display:"flex",flexWrap:"wrap",gap:3}}>
                {["BTC","ETH","SOL","DOGE","PEPE","XRP","SUI","LINK","TRUMP","OTHER"].map(c=>
                  <B key={c} on={coin===c} fn={()=>setCoin(c)}>{c}</B>
                )}
              </div>
              {coin==="OTHER" && <input value={cust} onChange={e=>setCust(e.target.value.toUpperCase())} placeholder="NEAR, APT..." style={inp}/>}
            </div>
            <div style={{flex:1}}>
              <Lbl>CAPITAL ($)</Lbl>
              <div style={{display:"flex",flexDirection:"column",gap:2}}>
                {[500,1000,2000,5000].map(v=>
                  <B key={v} on={cap===v} fn={()=>setCap(v)} clr="#00ff88">${v>=1000?(v/1000)+"K":v}</B>
                )}
                <input type="number" value={cap} onChange={e=>setCap(+e.target.value||0)} style={inp}/>
              </div>
            </div>
          </div>
          {/* Manual Price Override */}
          <div style={{marginTop:8}}>
            <Lbl>📌 BINANCE PRICE (optional — Binance se dekh ke dalo)</Lbl>
            <input type="number" value={manualPrice} onChange={e=>setManualPrice(e.target.value)} 
              placeholder={`Binance pe ${sel} ka current price likho...`}
              style={{...inp,fontSize:13,fontWeight:700,color:"#00ff88",borderColor:manualPrice?"#00ff8850":"#1a1230"}}/>
            {manualPrice && <div style={{fontSize:8,color:"#00ff88",marginTop:2}}>✅ ${sel} = ${Number(manualPrice).toLocaleString()} (manual) — AI isko use karega</div>}
          </div>
          <button onClick={run} disabled={loading} style={{
            width:"100%",padding:"13px 0",borderRadius:10,border:"none",marginTop:8,
            background:loading?"#1a1230":"linear-gradient(135deg,#ff3300,#ff5500)",
            color:loading?"#605088":"#fff",fontSize:13,fontWeight:800,
            cursor:loading?"wait":"pointer",
            boxShadow:loading?"none":"0 4px 20px rgba(255,51,0,0.25)",
            transition:"all .2s"
          }}>
            {loading ? "⏳ Analyzing..." : `⚡ ANALYZE ${sel}`}
          </button>
        </div>

        {/* Live Price Ticker */}
        {live && live.price > 0 && (
          <div style={{background:card,border:`1px solid ${live.change24>=0?"#00ff8830":"#ff113330"}`,borderRadius:10,padding:"10px 12px",marginBottom:8,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:"#00ff88",animation:"blink 1.5s infinite"}}/>
              <div>
                <div style={{fontSize:8,color:"#605088",textTransform:"uppercase",letterSpacing:1}}>
                  LIVE · {live.source||"API"} {live.note && <span style={{color:"#ff8800",fontSize:7,textTransform:"none"}}>{live.note}</span>}
                </div>
                <div style={{fontSize:16,fontWeight:900,color:"#f0eaff"}}>{live.name} {f$(live.price)}</div>
              </div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:12,fontWeight:700,color:live.change24>=0?"#00ff88":"#ff1133"}}>{live.change24>=0?"+":""}{live.change24?.toFixed(2)}%</div>
              <div style={{fontSize:8,color:"#605088"}}>
                L: {f$(live.low24)} · H: {f$(live.high24)}
              </div>
            </div>
          </div>
        )}
        {live && live.price > 0 && (
          <div style={{display:"flex",gap:3,marginBottom:8}}>
            {[
              {l:"7D",v:`${live.change7d>=0?"+":""}${live.change7d?.toFixed(1)}%`,c:live.change7d>=0?"#00ff88":"#ff1133"},
              {l:"30D",v:`${live.change30d>=0?"+":""}${live.change30d?.toFixed(1)}%`,c:live.change30d>=0?"#00ff88":"#ff1133"},
              {l:"VOL",v:`$${(live.vol24/1e9).toFixed(1)}B`,c:"#ffcc00"},
              {l:"ATH",v:`${live.athDrop?.toFixed(0)}%`,c:"#ff1133"},
              {l:"RANK",v:`#${live.rank}`,c:"#18ffff"},
            ].map((x,i)=><div key={i} style={{flex:1,textAlign:"center",padding:"4px 2px",background:card,border:`1px solid ${bdr}`,borderRadius:5}}>
              <div style={{fontSize:6.5,color:"#605088",textTransform:"uppercase"}}>{x.l}</div>
              <div style={{fontSize:10,fontWeight:800,color:x.c}}>{x.v}</div>
            </div>)}
          </div>
        )}
        <style>{`@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}`}</style>

        {/* Loading */}
        {loading && (
          <div style={{background:card,border:`1px solid ${bdr}`,borderRadius:10,padding:12,marginBottom:8}}>
            <div style={{fontSize:10.5,color:"#ff8800",fontWeight:600,marginBottom:5}}>{msg}</div>
            <div style={{width:"100%",height:5,borderRadius:3,background:"#1a1230",overflow:"hidden"}}>
              <div style={{width:`${prog}%`,height:"100%",borderRadius:3,background:"linear-gradient(90deg,#ff3300,#ff8800)",transition:"width .4s"}}/>
            </div>
          </div>
        )}

        {err && (
          <div style={{background:"#ff113310",border:"1px solid #ff113333",borderRadius:10,padding:10,marginBottom:8}}>
            <span style={{fontSize:11,color:"#ff1133",fontWeight:600}}>❌ {err}</span>
            <button onClick={run} style={{marginLeft:8,padding:"3px 10px",borderRadius:5,border:"1px solid #ff3300",background:"transparent",color:"#ff3300",fontSize:9,fontWeight:700,cursor:"pointer"}}>Retry</button>
          </div>
        )}

        {/* ═══ RESULTS ═══ */}
        {R && V && (
          <>
            {/* Direction + Score Banner */}
            <div style={{background:V.bg,border:`2px solid ${V.state==="FORMING"?"#ff8800":dc}`,borderRadius:14,padding:"14px 16px",marginBottom:8}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                <div>
                  <div style={{fontSize:22,fontWeight:900,color:V.state==="FORMING"?"#ff8800":dc}}>
                    {V.state==="FORMING"?"⏳":isL?"📈":"📉"} {V.state==="FORMING"?"SETUP FORMING":dir}
                  </div>
                  <div style={{fontSize:10,color:"#f0eaff",fontWeight:600}}>{R.coin} @ {f$(R.price)}</div>
                  <div style={{fontSize:8.5,color:"#605088"}}>24h: {f$(R.price_24h_low)} — {f$(R.price_24h_high)} · {R.mood||""}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:30,fontWeight:900,color:V.c,lineHeight:1}}>{R._total}<span style={{fontSize:13,color:"#403366"}}>/18</span></div>
                  <div style={{fontSize:9,fontWeight:700,color:V.c}}>{V.tag}</div>
                  <div style={{fontSize:8,color:"#605088"}}>{V.wr}</div>
                </div>
              </div>

              {/* Suggested direction for FORMING state */}
              {V.state==="FORMING" && R._sugDir && (
                <div style={{padding:"6px 10px",borderRadius:7,background:R._sugDir==="LONG"?"#00ff8808":"#ff113308",border:`1px solid ${R._sugDir==="LONG"?"#00ff8820":"#ff113320"}`,marginBottom:6}}>
                  <div style={{fontSize:10,fontWeight:800,color:R._sugDir==="LONG"?"#00ff88":"#ff1133"}}>
                    💡 DIRECTION: {R._sugDir} — Trigger ka wait
                  </div>
                  <div style={{fontSize:9,color:"#9080bb",marginTop:2}}>
                    SL Hunt: {R._sA}/12 ✅ · Technical: {R._sB}/6 ⏳ — Jab tech flip ho tab entry
                  </div>
                </div>
              )}

              {/* Hunt Info Bar */}
              {R.huntType && R.huntType !== "NO_HUNT" && (
                <div style={{display:"flex",gap:4}}>
                  <div style={{flex:1,padding:"5px 8px",borderRadius:6,background:R.huntType==="HUNTING_LONGS"?"#ff113310":"#00ff8810",border:`1px solid ${R.huntType==="HUNTING_LONGS"?"#ff113330":"#00ff8830"}`}}>
                    <div style={{fontSize:7,color:"#605088",textTransform:"uppercase",letterSpacing:1}}>HUNT TYPE</div>
                    <div style={{fontSize:10,fontWeight:800,color:R.huntType==="HUNTING_LONGS"?"#ff1133":"#00ff88"}}>{R.huntType==="HUNTING_LONGS"?"🎯 Longs ka SL Hunt":"🎯 Shorts ka SL Hunt"}</div>
                  </div>
                  <div style={{flex:1,padding:"5px 8px",borderRadius:6,background:"#ffcc0008",border:"1px solid #ffcc0020"}}>
                    <div style={{fontSize:7,color:"#605088",textTransform:"uppercase",letterSpacing:1}}>CROWD TRAPPED</div>
                    <div style={{fontSize:10,fontWeight:800,color:"#ffcc00"}}>{R.crowd==="LONG_HEAVY"?"📊 Longs overloaded":"📊 Shorts overloaded"} · {R.crowdPct||""}</div>
                  </div>
                </div>
              )}
              {R.huntZone && (
                <div style={{marginTop:4,padding:"4px 8px",borderRadius:5,background:"#ff880008",border:"1px solid #ff880015",fontSize:9,color:"#ff8800"}}>
                  🎯 Hunt Zone: <b style={{color:"#f0eaff"}}>{R.huntZone}</b>
                </div>
              )}
            </div>

            {/* Score Breakdown Bar */}
            <div style={{display:"flex",gap:4,marginBottom:4}}>
              <MiniCard t="SL HUNT" v={`${R._sA}/12`} c={R._sA>=8?"#00ff88":R._sA>=6?"#ffcc00":"#ff1133"}/>
              <MiniCard t="TECHNICAL" v={`${R._sB}/6`} c={R._sB>=4?"#00ff88":R._sB>=2?"#ffcc00":"#ff1133"}/>
              <MiniCard t="TOTAL" v={`${R._total}/18`} c={V.c}/>
              <MiniCard t="FEAR" v={R.fear_greed!=null?`${R.fear_greed}`:"—"} c={R.fear_greed<=25?"#ff1133":R.fear_greed>=75?"#00ff88":"#ffcc00"}/>
            </div>
            {/* Readiness Progress */}
            {V.state==="FORMING" && (
              <div style={{background:card,border:`1px solid ${bdr}`,borderRadius:7,padding:"6px 10px",marginBottom:8}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                  <span style={{fontSize:8,color:"#605088",textTransform:"uppercase",letterSpacing:1}}>TRADE READINESS</span>
                  <span style={{fontSize:9,fontWeight:700,color:"#ff8800"}}>
                    SL Hunt ✅ · Technicals ⏳ · Entry ⏳
                  </span>
                </div>
                <div style={{display:"flex",gap:2}}>
                  {[
                    {l:"Hunt 7+",done:R._sA>=7},
                    {l:"ADX>25",done:(R.emaSSL||[]).find(x=>x.n?.includes("ADX"))?.p},
                    {l:"RSI flip",done:(R.emaSSL||[]).find(x=>x.n?.includes("RSI"))?.p},
                    {l:"SSL cross",done:(R.emaSSL||[]).find(x=>x.n?.includes("SSL"))?.p},
                    {l:"EMA20",done:(R.emaSSL||[]).find(x=>x.n?.includes("EMA 20"))?.p},
                    {l:"Candle",done:(R.emaSSL||[]).find(x=>x.n?.includes("Candle"))?.p},
                  ].map((s,i)=>(
                    <div key={i} style={{flex:1,textAlign:"center",padding:"3px 1px",borderRadius:4,background:s.done?"#00ff8815":"#1a1230",border:`1px solid ${s.done?"#00ff8830":"#1a123080"}`}}>
                      <div style={{fontSize:9,color:s.done?"#00ff88":"#403366"}}>{s.done?"✅":"⏳"}</div>
                      <div style={{fontSize:6,color:s.done?"#00ff88":"#605088",fontWeight:600}}>{s.l}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* Tabs */}
            <div style={{display:"flex",gap:2,marginBottom:8,background:card,borderRadius:9,padding:3,border:`1px solid ${bdr}`}}>
              {["🎯Hunt","📈Tech","📰News","📋Trade","🛡️Risk","📝Prompt"].map((t,i)=>
                <button key={i} onClick={()=>setTab(i)} style={{
                  flex:1,padding:"6px 2px",borderRadius:6,border:"none",fontSize:9,fontWeight:700,cursor:"pointer",
                  background:tab===i?"#ff330018":"transparent",color:tab===i?"#ff3300":"#605088",transition:"all .15s"
                }}>{t}</button>
              )}
            </div>

            {/* ══ TAB 0: SL HUNT + LIQUIDATION HUNT ══ */}
            {tab===0 && (
              <div>
                {/* Hunt Explanation */}
                {(()=>{
                  const ht = R.huntType;
                  const isHuntL = ht==="HUNTING_LONGS";
                  const isHuntS = ht==="HUNTING_SHORTS";
                  const hc = isHuntL?"#ff1133":isHuntS?"#00ff88":"#ffcc00";
                  return (
                    <>
                      <div style={{background:`${hc}08`,border:`2px solid ${hc}30`,borderRadius:12,padding:14,marginBottom:8}}>
                        <div style={{fontSize:10,fontWeight:800,color:hc,textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>
                          {isHuntL?"🎯 LONGS KA SL HUNT → SHORT TRADE":isHuntS?"🎯 SHORTS KA SL HUNT → LONG SQUEEZE":"⏸️ HUNT SETUP FORMING"}
                        </div>
                        <div style={{fontSize:11.5,color:"#c0b0e0",lineHeight:1.8}}>
                          {isHuntL 
                            ? "Longs overloaded hain → unke SLs NEECHE hain → Whales push karenge neeche → SL trigger → Liq cascade → SHORT se profit lo"
                            : isHuntS
                            ? "Shorts overloaded hain → unke SLs UPAR hain → Whales squeeze karenge upar → Short SL trigger → Liquidation squeeze → LONG se profit lo"
                            : "Crowd mein koi strong imbalance nahi abhi — wait karo jab ek side clearly overloaded ho"}
                        </div>
                        {/* Suggested Direction when NO_TRADE but setup exists */}
                        {R._sugDir && (
                          <div style={{marginTop:8,padding:"6px 10px",borderRadius:7,background:R._sugDir==="LONG"?"#00ff8810":"#ff113310",border:`1px solid ${R._sugDir==="LONG"?"#00ff8825":"#ff113325"}`}}>
                            <div style={{fontSize:9,fontWeight:800,color:R._sugDir==="LONG"?"#00ff88":"#ff1133"}}>
                              💡 SUGGESTED: {R._sugDir} — Jab Trigger Aaye
                            </div>
                            <div style={{fontSize:9.5,color:"#9080bb",marginTop:2}}>{R._sugReason}</div>
                          </div>
                        )}
                      </div>

                {/* Crowd Data */}
                <div style={{display:"flex",gap:5,marginBottom:8}}>
                  <div style={{flex:1,background:card,border:`1px solid ${bdr}`,borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
                    <div style={{fontSize:7,color:"#605088",textTransform:"uppercase",letterSpacing:1}}>CROWD</div>
                    <div style={{fontSize:13,fontWeight:900,color:R.crowd==="LONG_HEAVY"?"#ff1133":R.crowd==="SHORT_HEAVY"?"#00ff88":"#ffcc00"}}>{R.crowd==="LONG_HEAVY"?"📊 Longs Heavy":R.crowd==="SHORT_HEAVY"?"📊 Shorts Heavy":"⚖️ Balanced"}</div>
                    <div style={{fontSize:9,color:"#9080bb"}}>{R.crowdPct||"—"}</div>
                  </div>
                  <div style={{flex:1,background:card,border:`1px solid ${bdr}`,borderRadius:8,padding:"8px 10px",textAlign:"center"}}>
                    <div style={{fontSize:7,color:"#605088",textTransform:"uppercase",letterSpacing:1}}>HUNT ZONE</div>
                    <div style={{fontSize:10,fontWeight:800,color:"#ff8800",lineHeight:1.3}}>{typeof R.huntZone==="string" && R.huntZone.length>30 ? R.huntZone.split(",")[0]||R.huntZone.substring(0,30) : R.huntZone||"—"}</div>
                    <div style={{fontSize:7,color:"#605088"}}>SLs yahan trigger honge</div>
                  </div>

// ═══ Sub-components ═══
function Lbl({children,c="#605088"}){ return <div style={{fontSize:8.5,fontWeight:700,color:c,marginBottom:4,textTransform:"uppercase",letterSpacing:1}}>{children}</div>; }

function B({children,on,fn,clr="#ff3300"}){ return <button onClick={fn} style={{padding:"4px 9px",borderRadius:5,fontSize:9.5,fontWeight:700,cursor:"pointer",border:`1px solid ${on?clr:"#1a1230"}`,background:on?`${clr}15`:"#0d0918",color:on?clr:"#9080bb",transition:"all .15s"}}>{children}</button>; }

function Stat({l,v,c}){ return <div style={{background:"#0d0918",border:"1px solid #1a1230",borderRadius:7,padding:"7px 5px",textAlign:"center",flex:1}}><div style={{fontSize:7,color:"#605088",textTransform:"uppercase",letterSpacing:1}}>{l}</div><div style={{fontSize:13,fontWeight:900,color:c,lineHeight:1,marginTop:2}}>{v}</div></div>; }

function MiniCard({t,v,c}){ return <div style={{flex:1,textAlign:"center",padding:"6px 2px",background:"#0d0918",border:"1px solid #1a1230",borderRadius:7}}><div style={{fontSize:6.5,color:"#605088",textTransform:"uppercase",letterSpacing:.5}}>{t}</div><div style={{fontSize:13,fontWeight:900,color:c,lineHeight:1,marginTop:1}}>{v}</div></div>; }

function Check({pass,name,val,why,i}){
  return <div style={{background:pass?"#00ff8804":"#0d0918",border:`1px solid ${pass?"#00ff8818":"#1a1230"}`,borderRadius:7,padding:"7px 9px",marginBottom:3}}>
    <div style={{display:"flex",alignItems:"center",gap:6}}>
      <div style={{width:18,height:18,borderRadius:4,display:"flex",alignItems:"center",justifyContent:"center",background:pass?"#00ff88":"#ff1133",color:pass?"#000":"#fff",fontSize:8,fontWeight:800,flexShrink:0}}>{pass?"✓":"✗"}</div>
      <span style={{flex:1,fontSize:10.5,fontWeight:700,color:pass?"#00ff88":"#9080bb"}}>{name}</span>
      <span style={{fontSize:9,fontWeight:700,color:pass?"#18ffff":"#605088",maxWidth:130,textAlign:"right",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{val}</span>
    </div>
    {why && <div style={{paddingLeft:24,fontSize:9.5,color:"#9080bb",lineHeight:1.5,marginTop:3}}>{why}</div>}
  </div>;
}

function NoTrade({s,why}){
  return <div style={{textAlign:"center",padding:28}}>
    <div style={{fontSize:40}}>🚫</div>
    <div style={{fontSize:15,fontWeight:800,color:"#ff1133",marginTop:6}}>NO TRADE — {s||0}/18</div>
    <div style={{fontSize:10.5,color:"#605088",marginTop:5,lineHeight:1.7}}>Score 8+ chahiye trade ke liye. Abhi setup nahi bana.</div>
    {why && <div style={{fontSize:10.5,color:"#9080bb",marginTop:6,lineHeight:1.7,textAlign:"left",padding:"8px 12px",background:"#0d0918",borderRadius:8,border:"1px solid #1a1230"}}>{why}</div>}
  </div>;
}

const inp = {width:"100%",padding:"6px 8px",borderRadius:5,border:"1px solid #1a1230",background:"#0d0918",color:"#f0eaff",fontSize:10.5,outline:"none",boxSizing:"border-box",marginTop:3};

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
